function getSpineClass(m){return MODULES[m-1].spineClass}
function renderBooks(filter){
var query=(filter||'').toLowerCase();
var shelves=document.getElementById('shelves');
shelves.innerHTML='';
MODULES.forEach(function(mod){
var modCourses=COURSES.filter(function(c){if(c.m!==mod.id)return false;if(query&&c.t.toLowerCase().indexOf(query)===-1&&c.d.toLowerCase().indexOf(query)===-1&&c.a.toLowerCase().indexOf(query)===-1)return false;return true});
if(modCourses.length===0)return;
var shelf=document.createElement('div');
var spineCls=getSpineClass(mod.id);
shelf.innerHTML='<div class="shelf-title">'+mod.icon+' <span class="badge '+mod.badgeClass+'">'+mod.badgeLabel+'</span> '+mod.subtitle+'</div><div class="shelf-row"><div class="books-grid" id="mod-'+mod.id+'"></div></div>';
shelves.appendChild(shelf);
var grid=document.getElementById('mod-'+mod.id);
modCourses.forEach(function(c){
var key='zy-lesson'+c.n;
var isDone=localStorage.getItem(key)==='done';
var book=document.createElement('div');
book.className='book-wrap';
book.innerHTML='<a class="book-link" href="lesson'+c.n+'.html"></a><div class="book '+spineCls+'"><div class="book-spine">'+c.t.replace(/《|》/g,'')+'</div><div class="book-pages"></div><div class="book-cover"><div class="cover-num">'+(c.n<10?'0':'')+c.n+'</div><div class="cover-title">'+c.t+'</div><div class="cover-author">'+c.a+'</div></div></div><div class="book-check'+(isDone?' done':'')+'" onclick="toggleCheck(event,'+c.n+')" title="标记已读">'+(isDone?'✓':'')+'</div>';
grid.appendChild(book);
});
});
updateProgress();
}
function toggleCheck(evt,n){evt.preventDefault();evt.stopPropagation();var key='zy-lesson'+n;var el=evt.target;if(localStorage.getItem(key)==='done'){localStorage.removeItem(key);el.classList.remove('done');el.textContent=''}else{localStorage.setItem(key,'done');el.classList.add('done');el.textContent='✓'}updateProgress()}
function updateProgress(){var done=0;for(var i=1;i<=100;i++)if(localStorage.getItem('zy-lesson'+i)==='done')done++;var pct=Math.round(done/100*100);document.getElementById('progressFill').style.width=pct+'%';document.getElementById('progressPct').textContent=done;document.getElementById('progressDone').textContent=pct+'%'}
function filterCourses(){renderBooks(document.getElementById('searchInput').value)}
window.addEventListener('scroll',function(){var h=document.documentElement,s=h.scrollTop||document.body.scrollTop,t=h.scrollHeight-h.clientHeight,p=t>0?Math.min(100,Math.round(s/t*100)):0;document.getElementById('scrollBar').style.width=p+'%'});
(function initParticles(){var container=document.getElementById('particles');for(var i=0;i<35;i++){var p=document.createElement('div');p.className='particle';var size=Math.random()*2.5+1;p.style.width=size+'px';p.style.height=size+'px';p.style.left=Math.random()*100+'%';p.style.setProperty('--dur',(Math.random()*12+10)+'s');p.style.setProperty('--delay',(Math.random()*12)+'s');container.appendChild(p)}})();
renderBooks();
</script>
